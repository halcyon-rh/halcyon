<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="-16 -16 96 96">
  <!-- Halcyon icon, glow version: for social media, banners, large sizes -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3EF0C2"/>
      <stop offset=".5" stop-color="#4C8FEA"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9FFF9"/>
      <stop offset=".55" stop-color="#C9D8FF"/>
      <stop offset="1" stop-color="#E7D6FF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1b1060" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="17" fill="url(#bg)" filter="url(#glow)" opacity=".75"/>
  <rect width="64" height="64" rx="17" fill="url(#bg)"/>
  <rect x=".6" y=".6" width="62.8" height="62.8" rx="16.4" fill="url(#shine)" stroke="#fff" stroke-opacity=".35" stroke-width=".6"/>
  <g fill="url(#ink)" stroke="url(#ink)" stroke-width="1" stroke-linejoin="round" filter="url(#soft)">
    <path d="M39.4 16 L50 10 L50 31 L39.4 27 Z" opacity=".7"/>
    <path d="M24.6 48 L14 54 L14 33 L24.6 37 Z" opacity=".7"/>
    <path d="M14 10 L24.6 16 L24.6 21 C24.6 23 26 24 28 24.9 L45 31.7 C48 33 50 35 50 38 L50 54 L39.4 48 L39.4 43 C39.4 41 38 40 36 39.1 L19 32.3 C16 31 14 29 14 26 Z"/>
  </g>
</svg>
